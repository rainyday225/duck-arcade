<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🦆 Duck Arcade</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:
    "Noto Sans TC",
    sans-serif;

    background:#f6f4ed;

    overflow:hidden;
}

/* =========================
   首頁
========================= */

#home{

    width:100vw;
    height:100vh;

    position:relative;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;
}

.logo{

    font-size:3rem;

    font-weight:900;

    color:#333;

    margin-bottom:12px;
}

.subtitle{

    color:#888;

    margin-bottom:40px;
}

/* =========================
   按鈕
========================= */

.menu{

    width:min(90vw,420px);

    display:flex;

    flex-direction:column;

    gap:15px;

    z-index:20;
}

.game-btn{

    padding:18px;

    border:none;

    border-radius:18px;

    background:white;

    cursor:pointer;

    font-size:18px;

    font-weight:700;

    box-shadow:
    0 4px 15px rgba(0,0,0,.08);

    transition:.25s;
}

.game-btn:hover{

    transform:translateY(-3px);
}

/* =========================
   鴨子
========================= */

#duck{

    width:90px;
    height:90px;

    position:absolute;

    top:100px;
    left:120px;

    transition:
    left 6s linear,
    top 6s linear,
    transform .3s;

    z-index:1;
}

/* =========================
   遊戲畫面
========================= */

#gameView{

    display:none;

    width:100vw;
    height:100vh;

    background:white;
}

.toolbar{

    height:60px;

    display:flex;

    align-items:center;

    padding:0 15px;

    background:#ffffff;

    border-bottom:1px solid #ddd;
}

.back-btn{

    border:none;

    padding:10px 18px;

    border-radius:10px;

    background:#ffe082;

    font-weight:700;

    cursor:pointer;
}

iframe{

    width:100%;
    height:calc(100vh - 60px);

    border:none;
}

</style>
</head>

<body>

<!-- ====================
首頁
==================== -->

<div id="home">

    <div id="duck">

        <svg viewBox="0 0 100 100">

            <ellipse cx="50"
            cy="55"
            rx="30"
            ry="22"
            fill="#FFD54F"/>

            <circle cx="42"
            cy="32"
            r="16"
            fill="#FFD54F"/>

            <ellipse cx="28"
            cy="33"
            rx="8"
            ry="4.5"
            fill="#FF9800"/>

            <circle cx="45"
            cy="29"
            r="2.5"
            fill="#111"/>

            <line
            x1="48"
            y1="74"
            x2="44"
            y2="84"
            stroke="#ff9800"
            stroke-width="3"/>

            <line
            x1="57"
            y1="74"
            x2="62"
            y2="84"
            stroke="#ff9800"
            stroke-width="3"/>

        </svg>

    </div>

    <div class="logo">

        🦆 Duck Arcade

    </div>

    <div class="subtitle">

        遊戲中心

    </div>

    <div class="menu">

        <button
        class="game-btn"
        onclick="openGame('3x3.html')">

            🧩 3x3 滑塊拼圖

        </button>

        <button
        class="game-btn"
        onclick="openGame('blockblast.html')">

            💥 Block Blast

        </button>

        <button
        class="game-btn"
        onclick="openGame('suika.html')">

            🍉 合成大西瓜

        </button>

        <button
        class="game-btn"
        onclick="openGame('minesweeper.html')">

            🐸 青蛙踩地雷

        </button>

    </div>

</div>

<!-- ====================
遊戲區
==================== -->

<div id="gameView">

    <div class="toolbar">

        <button
        class="back-btn"
        onclick="goHome()">

            ← 返回大廳

        </button>

    </div>

    <iframe id="gameFrame"></iframe>

</div>

<script>

/* ====================
切換遊戲
==================== */

function openGame(file){

    document
    .getElementById("home")
    .style.display="none";

    document
    .getElementById("gameView")
    .style.display="block";

    document
    .getElementById("gameFrame")
    .src=file;
}

function goHome(){

    document
    .getElementById("gameView")
    .style.display="none";

    document
    .getElementById("home")
    .style.display="flex";
}

/* ====================
鴨子散步
==================== */

const duck =
document.getElementById("duck");

function moveDuck(){

    const maxX =
        window.innerWidth - 100;

    const maxY =
        window.innerHeight * 0.45;

    const x =
        Math.random() * maxX;

    const y =
        Math.random() * maxY;

    duck.style.left = x + "px";
    duck.style.top = y + "px";

    if(Math.random() > 0.5){

        duck.style.transform="scaleX(-1)";
    }
    else{

        duck.style.transform="scaleX(1)";
    }
}

moveDuck();

setInterval(moveDuck,6000);

</script>

</body>
</html>
